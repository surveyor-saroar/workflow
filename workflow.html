<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Workflow Node Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0e1015;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ডার্ক ডট গ্রিড ব্যাকগ্রাউন্ড */
    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #111318;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
      overflow: hidden;
    }

    /* ক্যামেরা মুভমেন্ট ও জুম লেয়ার */
    .camera-stage {
      position: absolute;
      width: 1400px;
      height: 750px;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      transform: translate(-38%, -48%) scale(1.25);
      transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* কানেক্টিং SVG লাইন */
    svg.wires {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .wire-base {
      fill: none;
      stroke: #374151;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .wire-glow {
      fill: none;
      stroke: #22c55e;
      stroke-width: 4;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px #22c55e);
      stroke-dasharray: 90 1000;
      stroke-dashoffset: 1090;
      opacity: 0;
    }

    .wire-glow.pulse {
      opacity: 1;
      animation: flowPulse 1.1s ease-in-out forwards;
    }

    @keyframes flowPulse {
      0% { stroke-dashoffset: 350; opacity: 1; }
      85% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.25; }
    }

    /* নোড কার্ড স্টাইল */
    .node {
      position: absolute;
      width: 150px;
      background: #1b1f27;
      border: 2px solid #2e3440;
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.55);
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.35s ease;
    }

    .node.active {
      border-color: #22c55e;
      box-shadow: 0 0 26px rgba(34, 197, 94, 0.32), 0 14px 30px rgba(0, 0, 0, 0.6);
      transform: translateY(-3px);
    }

    .node.ai-node.active {
      border-color: #3b82f6;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
    }

    .node-icon {
      width: 46px;
      height: 46px;
      margin: 0 auto 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .node-title {
      font-size: 13px;
      font-weight: 600;
      color: #f9fafb;
      line-height: 1.3;
    }

    .node-sub {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }

    /* সবুজ টিক ব্যাজ */
    .check-badge {
      position: absolute;
      top: -9px;
      right: -9px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node.active .check-badge {
      transform: scale(1);
    }

    /* শেষ নোডে লাইভ শিট টেবিল */
    .sheet-node {
      width: 250px;
      text-align: left;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 11px;
    }

    .mini-table th, .mini-table td {
      border: 1px solid #374151;
      padding: 4px 6px;
      color: #d1d5db;
    }

    .mini-table tr.row-highlight {
      background: rgba(34, 197, 94, 0.22);
      color: #86efac;
    }

    .replay-btn {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: #ea580c;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(234, 88, 12, 0.4);
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="camera-stage" id="camera">
      <!-- কানেক্টিং তার -->
      <svg class="wires" viewBox="0 0 1400 750">
        <!-- 1 -> 2 -->
        <path class="wire-base" d="M 230 220 C 290 220, 300 260, 360 260" />
        <path class="wire-glow" id="w1" d="M 230 220 C 290 220, 300 260, 360 260" />

        <!-- 2 -> 3 -->
        <path class="wire-base" d="M 510 260 C 570 260, 580 340, 640 340" />
        <path class="wire-glow" id="w2" d="M 510 260 C 570 260, 580 340, 640 340" />

        <!-- 3 -> 4 (AI Agent) -->
        <path class="wire-base" d="M 790 340 C 850 340, 860 260, 920 260" />
        <path class="wire-glow" id="w3" d="M 790 340 C 850 340, 860 260, 920 260" />

        <!-- 4 -> 5 (Google Sheet) -->
        <path class="wire-base" d="M 1070 260 C 1120 260, 1130 260, 1170 260" />
        <path class="wire-glow" id="w4" d="M 1070 260 C 1120 260, 1130 260, 1170 260" />
      </svg>

      <!-- নোড ১ -->
      <div class="node" id="n1" style="left: 80px; top: 165px;">
        <div class="check-badge">✓</div>
        <div class="node-icon">📋</div>
        <div class="node-title">Form Submission</div>
        <div class="node-sub">Trigger Input</div>
      </div>

      <!-- নোড ২ -->
      <div class="node" id="n2" style="left: 360px; top: 205px;">
        <div class="check-badge">✓</div>
        <div class="node-icon">⚡</div>
        <div class="node-title">Data Filter</div>
        <div class="node-sub">Clean &amp; Validate</div>
      </div>

      <!-- নোড ৩ -->
      <div class="node" id="n3" style="left: 640px; top: 285px;">
        <div class="check-badge">✓</div>
        <div class="node-icon">🔀</div>
        <div class="node-title">Smart Router</div>
        <div class="node-sub">Condition Check</div>
      </div>

      <!-- নোড ৪ -->
      <div class="node ai-node" id="n4" style="left: 920px; top: 205px;">
        <div class="check-badge">✓</div>
        <div class="node-icon">🤖</div>
        <div class="node-title">AI Analysis</div>
        <div class="node-sub">Gemini Engine</div>
      </div>

      <!-- নোড ৫ -->
      <div class="node sheet-node" id="n5" style="left: 1170px; top: 185px;">
        <div class="check-badge">✓</div>
        <div class="node-title">📊 Add Data to Sheet</div>
        <table class="mini-table">
          <thead>
            <tr><th>Name</th><th>Score</th><th>Status</th></tr>
          </thead>
          <tbody id="sheetBody">
            <tr><td>Row 1</td><td>98%</td><td>Saved</td></tr>
            <tr><td>Row 2</td><td>94%</td><td>Queued</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <button class="replay-btn" onclick="startWorkflow()">▶ Execute Workflow</button>

  <script>
    const camera = document.getElementById("camera");
    const sheetBody = document.getElementById("sheetBody");

    function resetAll() {
      document.querySelectorAll(".node").forEach(n => n.classList.remove("active"));
      document.querySelectorAll(".wire-glow").forEach(w => w.classList.remove("pulse"));
      sheetBody.innerHTML = `
        <tr><td>Row 1</td><td>98%</td><td>Saved</td></tr>
        <tr><td>Row 2</td><td>94%</td><td>Queued</td></tr>
      `;
    }

    function startWorkflow() {
      resetAll();

      // ধাপ ১: শুরুতে নোড ১-এ ক্যামেরা ফোকাস
      camera.style.transform = "translate(-25%, -42%) scale(1.3)";
      document.getElementById("n1").classList.add("active");

      // ধাপ ২: তার ১ বেয়ে আলো যাবে ও নোড ২ সক্রিয় হবে
      setTimeout(() => {
        document.getElementById("w1").classList.add("pulse");
        camera.style.transform = "translate(-40%, -45%) scale(1.28)";
      }, 800);

      setTimeout(() => {
        document.getElementById("n2").classList.add("active");
      }, 1700);

      // ধাপ ৩: তার ২ -> নোড ৩
      setTimeout(() => {
        document.getElementById("w2").classList.add("pulse");
        camera.style.transform = "translate(-55%, -50%) scale(1.25)";
      }, 2400);

      setTimeout(() => {
        document.getElementById("n3").classList.add("active");
      }, 3300);

      // ধাপ ৪: তার ৩ -> AI নোড ৪
      setTimeout(() => {
        document.getElementById("w3").classList.add("pulse");
        camera.style.transform = "translate(-70%, -45%) scale(1.28)";
      }, 4000);

      setTimeout(() => {
        document.getElementById("n4").classList.add("active");
      }, 4900);

      // ধাপ ৫: তার ৪ -> Google Sheet নোড ৫ ও নতুন রো যুক্ত হওয়া
      setTimeout(() => {
        document.getElementById("w4").classList.add("pulse");
        camera.style.transform = "translate(-82%, -45%) scale(1.22)";
      }, 5600);

      setTimeout(() => {
        document.getElementById("n5").classList.add("active");
        sheetBody.innerHTML += `<tr class="row-highlight"><td>Row 3</td><td>99%</td><td>Done ✓</td></tr>`;
      }, 6500);

      // ধাপ ৬: শেষে ক্যামেরা জুম-আউট করে পুরো ওয়ার্কফ্লো দেখাবে
      setTimeout(() => {
        camera.style.transform = "translate(-50%, -48%) scale(0.88)";
      }, 7800);
    }

    window.addEventListener("load", () => {
      setTimeout(startWorkflow, 500);
    });
  </script>
</body>
</html>
