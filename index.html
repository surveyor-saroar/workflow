<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9:16 Workflow Node Dashboard • SVG Bezier & Karaoke</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      background:
        radial-gradient(circle at 18% 20%, rgba(64, 201, 255, 0.16), transparent 45%),
        radial-gradient(circle at 82% 80%, rgba(232, 28, 255, 0.16), transparent 50%),
        linear-gradient(135deg, #060911 0%, #090d16 55%, #12071b 100%);
    }

    /* ১. ডার্ক গ্রিড ক্যানভাস ব্যাকগ্রাউন্ড */
    .dark-grid-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.95) 45%, rgba(0, 0, 0, 0.25) 100%);
    }

    /* ৯:১৬ ভার্টিক্যাল কন্টেন্ট ফ্রেম */
    .content-9x16 {
      position: relative;
      z-index: 5;
      width: min(94vw, calc(94vh * 9 / 16));
      height: min(94vh, calc(94vw * 16 / 9));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 14px;
      pointer-events: none;
    }

    .header-tag {
      font-size: clamp(11px, 1.6vh, 14px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #090d16;
      background: linear-gradient(90deg, #40C9FF, #E81CFF);
      padding: 6px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(64, 201, 255, 0.22);
    }

    /* ২. নোড কার্ড ও ৩. SVG বেজিয়ার কানেক্টিং লাইন স্টেজ */
    .workflow-flow {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .flow-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: visible;
    }

    .bezier-wire {
      fill: none;
      stroke: rgba(148, 163, 184, 0.26);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .bezier-wire.active-wire {
      stroke: url(#wireGrad);
      stroke-width: 3.2;
    }

    .glow-pulse {
      r: 5.5;
      filter: drop-shadow(0 0 8px currentColor);
    }

    .nodes-stack {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .node-card {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      border-radius: 18px;
      background: rgba(11, 16, 30, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.16);
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    }

    /* জোড়/বিজোড় নোড সামান্য বাম-ডানে বাঁকানো তারের সাথে মানিয়ে সাজানো */
    .node-card:nth-child(odd) {
      transform: translateX(-6px);
    }
    .node-card:nth-child(even) {
      transform: translateX(6px);
    }

    .node-card.active {
      background: rgba(15, 23, 42, 0.94);
      border-color: rgba(64, 201, 255, 0.75);
      box-shadow: 0 10px 28px rgba(64, 201, 255, 0.18), 0 0 0 1px rgba(232, 28, 255, 0.25);
    }

    .node-card:nth-child(odd).active {
      transform: translateX(-2px) scale(1.02);
    }
    .node-card:nth-child(even).active {
      transform: translateX(2px) scale(1.02);
    }

    .node-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(30, 41, 59, 0.85);
      color: #40C9FF;
      border: 1px solid rgba(64, 201, 255, 0.25);
    }

    .node-card.active .node-icon {
      background: linear-gradient(135deg, #40C9FF, #E81CFF);
      color: #090d16;
      border-color: transparent;
    }

    .node-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .node-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: left;
    }

    .node-title {
      font-size: clamp(15px, 2.2vh, 19px);
      font-weight: 800;
      line-height: 1.25;
      color: #f8fafc;
    }

    .node-sub {
      font-size: clamp(12px, 1.7vh, 14px);
      color: #94a3b8;
      line-height: 1.35;
    }

    .node-card.active .node-sub {
      color: #cbd5e1;
    }

    .step-pill {
      margin-left: auto;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
    }

    .node-card.active .step-pill {
      background: #facc15;
      color: #090d16;
    }

    /* স্বচ্ছ কারাওকে ক্যাপশন ও সলিড হলুদ হাইলাইট */
    .karaoke-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: transparent;
      padding: 4px;
    }

    .karaoke-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 8px;
      font-size: clamp(17px, 2.6vh, 24px);
      font-weight: 800;
      line-height: 1.5;
    }

    .k-word {
      color: #ffffff;
      padding: 3px 9px;
      border-radius: 7px;
      background: rgba(7, 11, 20, 0.52);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      transition: background-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .k-word.active {
      background: #facc15;
      color: #090d16;
      text-shadow: none;
      transform: scale(1.06);
    }

    /* পজ অবস্থার নির্দেশক */
    .pause-indicator {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      font-size: 12px;
      font-weight: 800;
      color: #090d16;
      background: linear-gradient(90deg, #40C9FF, #E81CFF);
      padding: 6px 14px;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .pause-indicator.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="dark-grid-bg"></div>
  <div class="pause-indicator" id="pauseIndicator">PAUSED • ট্যাপ করে চালান</div>

  <div class="content-9x16">
    <div class="header-tag">AUTOMATED WORKFLOW • 9:16</div>

    <div class="workflow-flow" id="workflowFlow">
      <!-- SVG বাঁকানো (Bezier) তার ও গ্লোয়িং পালস -->
      <svg class="flow-svg" id="flowSvg" aria-hidden="true">
        <defs>
          <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#40C9FF" />
            <stop offset="100%" stop-color="#E81CFF" />
          </linearGradient>
        </defs>
        <g id="wiresGroup"></g>
        <g id="pulsesGroup"></g>
      </svg>

      <!-- ৪টি মূল নোড কার্ড -->
      <div class="nodes-stack" id="nodesStack">
        <div class="node-card active" data-step="0">
          <div class="node-icon">
            <svg viewBox="0 0 24 24">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <div class="node-text">
            <div class="node-title">On form submission</div>
            <div class="node-sub">নতুন তথ্য ফর্ম থেকে রিসিভ হচ্ছে</div>
          </div>
          <span class="step-pill">01</span>
        </div>

        <div class="node-card" data-step="1">
          <div class="node-icon">
            <svg viewBox="0 0 24 24">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
          </div>
          <div class="node-text">
            <div class="node-title">Intent Filter</div>
            <div class="node-sub">তথ্যের উদ্দেশ্য ও ক্যাটাগরি যাচাই</div>
          </div>
          <span class="step-pill">02</span>
        </div>

        <div class="node-card" data-step="2">
          <div class="node-icon">
            <svg viewBox="0 0 24 24">
              <rect x="4" y="4" width="16" height="16" rx="3"></rect>
              <circle cx="9" cy="11" r="1.2"></circle>
              <circle cx="15" cy="11" r="1.2"></circle>
              <path d="M9 15h6"></path>
            </svg>
          </div>
          <div class="node-text">
            <div class="node-title">AI Agent</div>
            <div class="node-sub">স্মার্ট প্রসেসিং ও কাঠামোগত আউটপুট</div>
          </div>
          <span class="step-pill">03</span>
        </div>

        <div class="node-card" data-step="3">
          <div class="node-icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <path d="M3 9h18"></path>
              <path d="M3 15h18"></path>
              <path d="M9 3v18"></path>
              <path d="M15 3v18"></path>
            </svg>
          </div>
          <div class="node-text">
            <div class="node-title">Google Sheet</div>
            <div class="node-sub">সারিবদ্ধভাবে ডেটা সংরক্ষণ ও আপডেট</div>
          </div>
          <span class="step-pill">04</span>
        </div>
      </div>
    </div>

    <!-- সলিড হলুদ কারাওকে ক্যাপশন -->
    <div class="karaoke-box">
      <div class="karaoke-line" id="karaokeLine"></div>
    </div>
  </div>

  <script>
    const flowContainer = document.getElementById("workflowFlow");
    const wiresGroup = document.getElementById("wiresGroup");
    const pulsesGroup = document.getElementById("pulsesGroup");
    const nodeCards = Array.from(document.querySelectorAll(".node-card"));
    const karaokeLine = document.getElementById("karaokeLine");
    const pauseIndicator = document.getElementById("pauseIndicator");

    const stepCaptions = [
      {
        duration: 4000,
        words: ["ফর্ম", "সাবমিট", "হওয়ার", "সাথে", "সাথে", "ওয়ার্কফ্লো", "শুরু", "হয়।"]
      },
      {
        duration: 4000,
        words: ["ইনটেন্ট", "ফিল্টার", "তথ্যের", "মূল", "উদ্দেশ্য", "আলাদা", "করে।"]
      },
      {
        duration: 4200,
        words: ["এআই", "এজেন্ট", "দ্রুত", "তথ্য", "বিশ্লেষণ", "করে", "সাজায়।"]
      },
      {
        duration: 4200,
        words: ["সবশেষে", "তথ্যগুলো", "গুগল", "শিটে", "নিখুঁতভাবে", "সেভ", "হয়!"]
      }
    ];

    let pathsData = [];
    let pulses = [];
    let isPaused = false;
    let currentStep = 0;
    let stepElapsed = 0;
    let lastTime = performance.now();
    let wordSpans = [];

    /* নোড কার্ডগুলোর কেন্দ্রবিন্দু ধরে SVG Bezier কার্ভ তৈরি */
    function buildBezierWires() {
      wiresGroup.innerHTML = "";
      pulsesGroup.innerHTML = "";
      pathsData = [];
      pulses = [];

      const containerRect = flowContainer.getBoundingClientRect();
      if (!containerRect.width || !containerRect.height) return;

      for (let i = 0; i < nodeCards.length - 1; i++) {
        const aRect = nodeCards[i].getBoundingClientRect();
        const bRect = nodeCards[i + 1].getBoundingClientRect();

        const x1 = aRect.left - containerRect.left + aRect.width * 0.5;
        const y1 = aRect.bottom - containerRect.top - 2;
        const x2 = bRect.left - containerRect.left + bRect.width * 0.5;
        const y2 = bRect.top - containerRect.top + 2;

        const midY = (y1 + y2) * 0.5;
        const curveOffset = (i % 2 === 0 ? 1 : -1) * Math.min(46, containerRect.width * 0.12);
        const cx1 = x1 + curveOffset;
        const cx2 = x2 - curveOffset;

        const d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${cx1.toFixed(1)} ${midY.toFixed(1)}, ${cx2.toFixed(1)} ${midY.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`;

        const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pathEl.setAttribute("d", d);
        pathEl.setAttribute("class", "bezier-wire");
        pathEl.dataset.index = i;
        wiresGroup.appendChild(pathEl);

        const totalLen = pathEl.getTotalLength();
        pathsData.push({ pathEl, totalLen });

        // প্রতিটি তারের জন্য সবুজ ও নীল/সায়ান পালস তৈরি
        const colors = ["#22c55e", "#38bdf8"];
        colors.forEach((col, cIdx) => {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("class", "glow-pulse");
          circle.setAttribute("fill", col);
          circle.style.color = col;
          pulsesGroup.appendChild(circle);

          pulses.push({
            pathIdx: i,
            el: circle,
            t: cIdx * 0.5,
            speed: 0.0042 + i * 0.0004
          });
        });
      }

      highlightActiveWire();
    }

    function highlightActiveWire() {
      const wireEls = wiresGroup.querySelectorAll(".bezier-wire");
      wireEls.forEach((el, idx) => {
        el.classList.toggle("active-wire", idx === currentStep || idx === currentStep - 1);
      });
    }

    function renderStep(stepIndex) {
      currentStep = stepIndex;
      nodeCards.forEach((card, idx) => {
        card.classList.toggle("active", idx === currentStep);
      });
      highlightActiveWire();

      const data = stepCaptions[currentStep];
      karaokeLine.innerHTML = "";
      wordSpans = data.words.map((word) => {
        const span = document.createElement("span");
        span.className = "k-word";
        span.textContent = word;
        karaokeLine.appendChild(span);
        return span;
      });
    }

    function updateLoop(now) {
      const dt = now - lastTime;
      lastTime = now;

      if (!isPaused) {
        stepElapsed += dt;
        const activeCap = stepCaptions[currentStep];

        if (stepElapsed >= activeCap.duration) {
          stepElapsed = 0;
          const nextStep = (currentStep + 1) % nodeCards.length;
          renderStep(nextStep);
        } else {
          const progress = stepElapsed / activeCap.duration;
          const activeWordIdx = Math.min(
            wordSpans.length - 1,
            Math.floor(progress * wordSpans.length)
          );
          wordSpans.forEach((span, idx) => {
            span.classList.toggle("active", idx === activeWordIdx);
          });
        }

        // SVG তারের ভেতর গ্লোয়িং পালস চালানো
        for (const p of pulses) {
          const item = pathsData[p.pathIdx];
          if (!item) continue;
          p.t += p.speed * (dt / 16.67);
          if (p.t > 1) p.t -= 1;

          const pt = item.pathEl.getPointAtLength(p.t * item.totalLen);
          p.el.setAttribute("cx", pt.x.toFixed(1));
          p.el.setAttribute("cy", pt.y.toFixed(1));
        }
      }

      requestAnimationFrame(updateLoop);
    }

    function togglePlayPause() {
      isPaused = !isPaused;
      lastTime = performance.now();
      pauseIndicator.classList.toggle("visible", isPaused);
    }

    window.addEventListener("pointerdown", togglePlayPause);
    window.addEventListener("resize", () => {
      requestAnimationFrame(buildBezierWires);
    });

    // শুরু করা
    renderStep(0);
    requestAnimationFrame(() => {
      buildBezierWires();
      requestAnimationFrame(updateLoop);
    });
  </script>
</body>
</html>
