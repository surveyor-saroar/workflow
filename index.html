<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n8n Style Workflow Reel • 9:16 Auto Camera & Karaoke</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      background:
        radial-gradient(circle at 18% 18%, rgba(64, 201, 255, 0.14), transparent 44%),
        radial-gradient(circle at 82% 82%, rgba(232, 28, 255, 0.14), transparent 48%),
        #111318;
    }

    /* n8n-স্টাইল সূক্ষ্ম ডটেড ক্যানভাস ব্যাকগ্রাউন্ড (সবচেয়ে নিচের লেয়ারে) */
    .n8n-dots-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(148, 163, 184, 0.24) 1.25px, transparent 1.25px);
      background-size: 22px 22px;
      mask-image: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.98) 52%, rgba(0, 0, 0, 0.35) 100%);
    }

    /* ৯:১৬ ভার্টিক্যাল কন্টেন্ট ফ্রেম (ব্যাকগ্রাউন্ডের ওপরে স্পষ্টভাবে দৃশ্যমান) */
    .stage-9x16 {
      position: relative;
      z-index: 10;
      width: min(96vw, calc(96vh * 9 / 16));
      height: min(96vh, calc(96vw * 16 / 9));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 10px 22px;
      pointer-events: none;
      overflow: visible;
    }

    /* উপরের ছোট স্ট্যাটাস পিল */
    .top-pill {
      position: relative;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e2e8f0;
      background: rgba(24, 27, 35, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.24);
      padding: 7px 15px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    /* ক্যামেরা ভিউপোর্ট ও ক্যানভাস রিগ */
    .camera-viewport {
      position: relative;
      z-index: 12;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .n8n-canvas {
      position: relative;
      z-index: 14;
      width: 920px;
      height: 440px;
      flex-shrink: 0;
      transform-origin: center center;
      transform: translate(0px, 0px) scale(0.45);
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    /* SVG তার ও পালস লেয়ার */
    .wires-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: visible;
    }

    .n8n-wire {
      fill: none;
      stroke: #475569;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke 0.35s ease, stroke-width 0.35s ease;
    }

    .n8n-wire.sub-wire {
      stroke-dasharray: 6 6;
      stroke-width: 2.4;
      stroke: #64748b;
    }

    .n8n-wire.active-wire {
      stroke: url(#n8nGrad);
      stroke-width: 4;
    }

    .wire-pulse {
      r: 6;
      filter: drop-shadow(0 0 8px currentColor);
    }

    /* আসল n8n নোড ডিজাইন */
    .n8n-node {
      position: absolute;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.35s ease;
    }

    .node-box {
      position: relative;
      width: 104px;
      height: 104px;
      border-radius: 24px;
      background: #1e212b;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.55);
      transition: border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease, transform 0.35s ease;
    }

    /* AI Agent বড় হরিজন্টাল বক্স */
    .n8n-node.agent-node .node-box {
      width: 230px;
      height: 104px;
      padding: 0 18px;
      justify-content: flex-start;
      gap: 14px;
    }

    /* সাব-নোড (গোল n8n টুল/মডেল নোড) */
    .n8n-node.sub-node .node-box {
      width: 74px;
      height: 74px;
      border-radius: 999px;
      background: #191c24;
    }

    /* সক্রিয় ও সম্পন্ন নোড স্টেট */
    .n8n-node.active .node-box {
      background: #232734;
      border-color: #40C9FF;
      box-shadow:
        0 0 0 4px rgba(64, 201, 255, 0.18),
        0 0 28px rgba(232, 28, 255, 0.28),
        0 16px 34px rgba(0, 0, 0, 0.65);
      transform: scale(1.05);
    }

    .n8n-node.done .node-box {
      border-color: #22c55e;
    }

    /* n8n কানেক্টর পোর্ট ডট */
    .port {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #94a3b8;
      border: 2.5px solid #111318;
      z-index: 5;
    }

    .port.in {
      left: -7px;
      top: 50%;
      transform: translateY(-50%);
    }

    .port.out {
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
    }

    .port.bottom-1 {
      bottom: -7px;
      left: 34%;
      transform: translateX(-50%) rotate(45deg);
      border-radius: 2px;
    }

    .port.bottom-2 {
      bottom: -7px;
      left: 66%;
      transform: translateX(-50%) rotate(45deg);
      border-radius: 2px;
    }

    .port.top {
      top: -7px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      border-radius: 2px;
    }

    .n8n-node.active .port,
    .n8n-node.done .port {
      background: #22c55e;
    }

    /* সবুজ চেকমার্ক ব্যাজ (✓) */
    .node-check {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.5);
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .n8n-node.active .node-check,
    .n8n-node.done .node-check {
      opacity: 1;
      transform: scale(1);
    }

    /* নোড আইকন */
    .icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sub-node .icon-wrap {
      width: 36px;
      height: 36px;
    }

    .icon-wrap svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sub-node .icon-wrap svg {
      width: 21px;
      height: 21px;
    }

    .ic-orange { background: rgba(249, 115, 22, 0.16); color: #fb923c; }
    .ic-blue   { background: rgba(56, 189, 248, 0.16); color: #38bdf8; }
    .ic-purple { background: rgba(192, 132, 252, 0.18); color: #c084fc; }
    .ic-green  { background: rgba(34, 197, 94, 0.16); color: #4ade80; }
    .ic-cyan   { background: rgba(64, 201, 255, 0.16); color: #40C9FF; }

    .agent-inner-text {
      text-align: left;
    }

    .agent-inner-title {
      font-size: 17px;
      font-weight: 800;
      color: #f8fafc;
    }

    .agent-inner-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* n8n বক্সের নিচে নাম ও সাবটাইটেল */
    .node-label {
      margin-top: 10px;
      text-align: center;
      white-space: nowrap;
    }

    .node-name {
      font-size: 15px;
      font-weight: 800;
      color: #f1f5f9;
    }

    .node-role {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .sub-node .node-name {
      font-size: 13px;
    }

    /* Google Sheet নোডের নিচে লাইভ মিনি টেবিল */
    .sheet-card {
      margin-top: 10px;
      width: 215px;
      background: rgba(22, 25, 34, 0.95);
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .sheet-card table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .sheet-card th,
    .sheet-card td {
      padding: 5px 8px;
      text-align: left;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }

    .sheet-card th {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-weight: 800;
    }

    .sheet-card tr.flash-row {
      background: rgba(34, 197, 94, 0.22);
      color: #dcfce7;
      font-weight: 700;
    }

    /* নিচে বড় ও এক-লাইনের হলুদ কারাওকে ক্যাপশন */
    .karaoke-box {
      position: relative;
      z-index: 20;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      padding: 4px 2px;
      overflow: hidden;
    }

    .karaoke-line {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 4px 5px;
      font-size: clamp(20px, 2.9vh, 28px);
      font-weight: 800;
      line-height: 1.35;
      white-space: nowrap;
    }

    .k-word {
      color: #ffffff;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(11, 13, 19, 0.65);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .k-word.active {
      background: #facc15;
      color: #090d16;
      text-shadow: none;
      transform: scale(1.06);
    }

    /* পজ ব্যাজ */
    .pause-pill {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 30;
      font-size: 12px;
      font-weight: 800;
      color: #090d16;
      background: linear-gradient(90deg, #40C9FF, #E81CFF);
      padding: 6px 14px;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .pause-pill.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="n8n-dots-bg"></div>
  <div class="pause-pill" id="pausePill">PAUSED • ট্যাপ করে চালান</div>

  <div class="stage-9x16">
    <div class="top-pill">
      <span class="live-dot"></span>
      <span>n8n AI Lead Automation</span>
    </div>

    <div class="camera-viewport" id="cameraViewport">
      <div class="n8n-canvas" id="n8nCanvas">
        <!-- SVG Bezier কানেক্টিং তার ও গ্লোয়িং পালস -->
        <svg class="wires-svg" id="wiresSvg" viewBox="0 0 920 440">
          <defs>
            <linearGradient id="n8nGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#40C9FF" />
              <stop offset="100%" stop-color="#E81CFF" />
            </linearGradient>
          </defs>
          <g id="wiresLayer"></g>
          <g id="pulsesLayer"></g>
        </svg>

        <!-- নোড ১: Form Trigger -->
        <div class="n8n-node active" id="node-0" style="left: 36px; top: 96px;">
          <div class="node-box">
            <div class="node-check">✓</div>
            <div class="icon-wrap ic-orange">
              <svg stroke="currentColor" viewBox="0 0 24 24">
                <path d="M9 11l3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
              </svg>
            </div>
            <div class="port out"></div>
          </div>
          <div class="node-label">
            <div class="node-name">On Form Submit</div>
            <div class="node-role">Webhook Trigger</div>
          </div>
        </div>

        <!-- নোড ২: Intent Filter -->
        <div class="n8n-node" id="node-1" style="left: 230px; top: 96px;">
          <div class="node-box">
            <div class="node-check">✓</div>
            <div class="port in"></div>
            <div class="icon-wrap ic-blue">
              <svg stroke="currentColor" viewBox="0 0 24 24">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
              </svg>
            </div>
            <div class="port out"></div>
          </div>
          <div class="node-label">
            <div class="node-name">Intent Filter</div>
            <div class="node-role">Lead Qualification</div>
          </div>
        </div>

        <!-- নোড ৩: AI Agent (n8n Main Agent Box) -->
        <div class="n8n-node agent-node" id="node-2" style="left: 430px; top: 96px;">
          <div class="node-box">
            <div class="node-check">✓</div>
            <div class="port in"></div>
            <div class="icon-wrap ic-purple">
              <svg stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="15" rx="3"></rect>
                <circle cx="9" cy="11" r="1.3"></circle>
                <circle cx="15" cy="11" r="1.3"></circle>
                <path d="M9 15h6"></path>
              </svg>
            </div>
            <div class="agent-inner-text">
              <div class="agent-inner-title">AI Agent</div>
              <div class="agent-inner-sub">Tools Agent • Auto Reply</div>
            </div>
            <div class="port out"></div>
            <div class="port bottom-1"></div>
            <div class="port bottom-2"></div>
          </div>
          <div class="node-label">
            <div class="node-name">Smart AI Processor</div>
            <div class="node-role">Context + Memory</div>
          </div>
        </div>

        <!-- সাব-নোড ৩ক: OpenAI Chat Model -->
        <div class="n8n-node sub-node" id="sub-0" style="left: 446px; top: 285px;">
          <div class="node-box">
            <div class="port top"></div>
            <div class="icon-wrap ic-cyan">
              <svg stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 8v8M8 12h8"></path>
              </svg>
            </div>
          </div>
          <div class="node-label">
            <div class="node-name">Chat Model</div>
          </div>
        </div>

        <!-- সাব-নোড ৩খ: Window Memory -->
        <div class="n8n-node sub-node" id="sub-1" style="left: 568px; top: 285px;">
          <div class="node-box">
            <div class="port top"></div>
            <div class="icon-wrap ic-purple">
              <svg stroke="currentColor" viewBox="0 0 24 24">
                <ellipse cx="12" cy="6" rx="7" ry="3"></ellipse>
                <path d="M5 6v6c0 1.66 3.13 3 7 3s7-1.34 7-3V6"></path>
                <path d="M5 12v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"></path>
              </svg>
            </div>
          </div>
          <div class="node-label">
            <div class="node-name">Memory</div>
          </div>
        </div>

        <!-- নোড ৪: Google Sheets + Live Table -->
        <div class="n8n-node" id="node-3" style="left: 715px; top: 96px;">
          <div class="node-box">
            <div class="node-check">✓</div>
            <div class="port in"></div>
            <div class="icon-wrap ic-green">
              <svg stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path>
              </svg>
            </div>
          </div>
          <div class="node-label">
            <div class="node-name">Google Sheets</div>
            <div class="node-role">Append Row</div>
          </div>
          <div class="sheet-card">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Intent</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="sheetRows">
                <tr>
                  <td>রাকিব</td>
                  <td>Order</td>
                  <td style="color:#4ade80;font-weight:800;">Done ✓</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- নিচে এক লাইনে বড় হলুদ কারাওকে ক্যাপশন -->
    <div class="karaoke-box">
      <div class="karaoke-line" id="karaokeLine"></div>
    </div>
  </div>

  <script>
    const viewport = document.getElementById("cameraViewport");
    const canvas = document.getElementById("n8nCanvas");
    const wiresLayer = document.getElementById("wiresLayer");
    const pulsesLayer = document.getElementById("pulsesLayer");
    const karaokeLine = document.getElementById("karaokeLine");
    const pausePill = document.getElementById("pausePill");
    const sheetRows = document.getElementById("sheetRows");

    const mainNodes = [
      document.getElementById("node-0"),
      document.getElementById("node-1"),
      document.getElementById("node-2"),
      document.getElementById("node-3")
    ];
    const subNodes = [
      document.getElementById("sub-0"),
      document.getElementById("sub-1")
    ];

    /* প্রতিটি ধাপের অটো-ক্যামেরা ফোকাস ও ১-লাইনের ছোট ক্যাপশন */
    const steps = [
      {
        focusX: 115,
        focusY: 165,
        zoom: 1.18,
        duration: 3600,
        words: ["ফর্ম", "আসলেই", "অটোমেশন", "শুরু", "হয়।"]
      },
      {
        focusX: 295,
        focusY: 165,
        zoom: 1.18,
        duration: 3600,
        words: ["ফিল্টার", "সঠিক", "ক্লায়েন্ট", "আলাদা", "করে।"]
      },
      {
        focusX: 545,
        focusY: 225,
        zoom: 1.05,
        duration: 4000,
        words: ["AI", "এজেন্ট", "স্মার্ট", "উত্তর", "বানায়।"]
      },
      {
        focusX: 790,
        focusY: 215,
        zoom: 1.08,
        duration: 3800,
        words: ["গুগল", "শিটে", "ডেটা", "সেভ", "হয়।"]
      },
      {
        focusX: 465,
        focusY: 210,
        zoom: 0.56,
        duration: 4200,
        words: ["পুরো", "n8n", "ফ্লো", "একদম", "রেডি!"]
      }
    ];

    const sampleLeads = [
      { name: "তানভীর", intent: "Booking", status: "Saved ✓" },
      { name: "সুমাইয়া", intent: "Support", status: "Synced ✓" },
      { name: "আরিফ", intent: "Quote", status: "Done ✓" }
    ];

    const wireSpecs = [
      { d: "M 140 148 C 185 148, 185 148, 230 148", step: 0, sub: false },
      { d: "M 334 148 C 382 148, 382 148, 430 148", step: 1, sub: false },
      { d: "M 660 148 C 688 148, 688 148, 715 148", step: 2, sub: false },
      { d: "M 508 200 C 508 242, 483 242, 483 285", step: 2, sub: true },
      { d: "M 582 200 C 582 242, 605 242, 605 285", step: 2, sub: true }
    ];

    let wiresData = [];
    let pulses = [];
    let isPaused = false;
    let currentStep = 0;
    let elapsed = 0;
    let lastTick = performance.now();
    let wordEls = [];
    let leadIdx = 0;

    function initSvgWires() {
      wiresLayer.innerHTML = "";
      pulsesLayer.innerHTML = "";
      wiresData = [];
      pulses = [];

      wireSpecs.forEach((spec, idx) => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", spec.d);
        path.setAttribute("class", spec.sub ? "n8n-wire sub-wire" : "n8n-wire");
        wiresLayer.appendChild(path);

        const len = path.getTotalLength();
        wiresData.push({ path, len, step: spec.step, sub: spec.sub });

        const colors = spec.sub ? ["#c084fc"] : ["#22c55e", "#40C9FF"];
        colors.forEach((col, cIdx) => {
          const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          dot.setAttribute("class", "wire-pulse");
          dot.setAttribute("fill", col);
          dot.style.color = col;
          pulsesLayer.appendChild(dot);

          pulses.push({
            wireIdx: idx,
            el: dot,
            t: cIdx * 0.5,
            speed: spec.sub ? 0.007 : 0.0065
          });
        });
      });
    }

    function moveCameraToStep(stepObj) {
      const vpRect = viewport.getBoundingClientRect();
      const baseScale = Math.min(vpRect.width / 460, vpRect.height / 420);
      const finalScale = baseScale * stepObj.zoom;

      const offsetX = (460 - stepObj.focusX) * finalScale;
      const offsetY = (220 - stepObj.focusY) * finalScale;

      canvas.style.transform = `translate(${offsetX.toFixed(1)}px, ${offsetY.toFixed(1)}px) scale(${finalScale.toFixed(3)})`;
    }

    function addNewSheetRow() {
      const item = sampleLeads[leadIdx % sampleLeads.length];
      leadIdx++;
      const tr = document.createElement("tr");
      tr.className = "flash-row";
      tr.innerHTML = `<td>${item.name}</td><td>${item.intent}</td><td style="color:#4ade80;font-weight:800;">${item.status}</td>`;
      sheetRows.appendChild(tr);
      if (sheetRows.children.length > 3) {
        sheetRows.removeChild(sheetRows.firstElementChild);
      }
    }

    function setStep(idx) {
      currentStep = idx;
      const stepObj = steps[currentStep];
      const activeNodeIdx = Math.min(currentStep, mainNodes.length - 1);

      mainNodes.forEach((node, i) => {
        if (currentStep === 4) {
          node.classList.remove("active");
          node.classList.add("done");
        } else {
          node.classList.toggle("active", i === activeNodeIdx);
          node.classList.toggle("done", i < activeNodeIdx);
        }
      });

      subNodes.forEach((sNode) => {
        sNode.classList.toggle("active", currentStep === 2);
        sNode.classList.toggle("done", currentStep > 2);
      });

      wiresData.forEach((w) => {
        const isHot = currentStep === 4 || w.step === activeNodeIdx || w.step === activeNodeIdx - 1;
        w.path.classList.toggle("active-wire", isHot);
      });

      if (currentStep === 3) {
        addNewSheetRow();
      }

      moveCameraToStep(stepObj);

      karaokeLine.innerHTML = "";
      wordEls = stepObj.words.map((word) => {
        const span = document.createElement("span");
        span.className = "k-word";
        span.textContent = word;
        karaokeLine.appendChild(span);
        return span;
      });
    }

    function animate(now) {
      const dt = now - lastTick;
      lastTick = now;

      if (!isPaused) {
        elapsed += dt;
        const stepObj = steps[currentStep];

        if (elapsed >= stepObj.duration) {
          elapsed = 0;
          setStep((currentStep + 1) % steps.length);
        } else {
          const progress = elapsed / stepObj.duration;
          const activeWord = Math.min(
            wordEls.length - 1,
            Math.floor(progress * wordEls.length)
          );
          wordEls.forEach((el, i) => {
            el.classList.toggle("active", i === activeWord);
          });
        }

        for (const p of pulses) {
          const w = wiresData[p.wireIdx];
          if (!w) continue;
          p.t += p.speed * (dt / 16.67);
          if (p.t > 1) p.t -= 1;

          const pt = w.path.getPointAtLength(p.t * w.len);
          p.el.setAttribute("cx", pt.x.toFixed(1));
          p.el.setAttribute("cy", pt.y.toFixed(1));
        }
      }

      requestAnimationFrame(animate);
    }

    function togglePause() {
      isPaused = !isPaused;
      lastTick = performance.now();
      pausePill.classList.toggle("visible", isPaused);
    }

    window.addEventListener("pointerdown", togglePause);
    window.addEventListener("resize", () => moveCameraToStep(steps[currentStep]));

    initSvgWires();
    setStep(0);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
