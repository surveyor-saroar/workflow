<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n8n Style Workflow Reel • 9:16 Auto Camera & Scene 6 Intro</title>
  <style>
    :root {
      --glow1-color: rgba(64, 201, 255, 0.16);
      --glow1-pos: 24% 24%;
      --glow2-color: rgba(232, 28, 255, 0.16);
      --glow2-pos: 66% 58%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      background-color: #111318;
    }

    body.is-paused .n8n-dots-bg,
    body.is-paused .typing-cursor,
    body.is-paused .saroar-badge,
    body.is-paused .icon-wrap svg,
    body.is-paused .s6-mouse-cursor,
    body.is-paused .s6-ripple {
      animation-play-state: paused !important;
    }

    .scene-ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at var(--glow1-pos), var(--glow1-color), transparent 46%),
        radial-gradient(circle at var(--glow2-pos), var(--glow2-color), transparent 50%),
        #111318;
      transition: background 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .n8n-dots-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image: radial-gradient(rgba(148, 163, 184, 0.24) 1.25px, transparent 1.25px);
      background-size: 22px 22px;
      mask-image: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.96) 50%, rgba(0, 0, 0, 0.28) 100%);
      transform-origin: center center;
      animation: subtleDotsZoom 12s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes subtleDotsZoom {
      0% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(1.035); opacity: 1; }
    }

    .stage-9x16 {
      position: relative;
      z-index: 10;
      width: min(96vw, calc(96vh * 9 / 16));
      height: min(94vh, calc(96vw * 16 / 9));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 32px;
      pointer-events: none;
      overflow: visible;
    }

    .top-stack {
      position: relative;
      z-index: 24;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }

    /* উপরে ৩টি টাইটেল বার */
    .three-title-bars {
      width: 100%;
      max-width: 390px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .title-bar-item {
      background: rgba(24, 27, 35, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 10.5px;
      font-weight: 800;
      color: #cbd5e1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.3s ease;
    }

    .title-bar-item.active {
      background: #facc15;
      color: #090d16;
      border-color: #facc15;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.35);
    }

    .title-bar-item.done {
      border-color: rgba(34, 197, 94, 0.55);
      color: #86efac;
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #e2e8f0;
      background: rgba(24, 27, 35, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.28);
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(-10px) scale(0.92);
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      overflow: hidden;
      transition:
        opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        max-height 0.4s ease,
        padding 0.4s ease;
    }

    .top-pill.show-title {
      opacity: 1;
      transform: translateY(0) scale(1);
      max-height: 44px;
      padding-top: 6px;
      padding-bottom: 6px;
    }

    .title-highlight-words {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 2px 7px;
      margin-left: 3px;
      color: #e2e8f0;
      transition: color 0.35s ease 0.42s;
    }

    .title-highlight-words::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: #ffd24c;
      border-radius: 6px;
      transform: scaleX(0);
      transform-origin: left center;
      transition: none;
    }

    .top-pill.show-title .title-highlight-words {
      color: #090d16;
    }

    .top-pill.show-title .title-highlight-words::before {
      transform: scaleX(1);
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.32s;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      flex-shrink: 0;
    }

    .saroar-widget {
      width: 94%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .saroar-search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 21, 29, 0.94);
      border: 1px solid rgba(250, 204, 21, 0.45);
      border-radius: 12px;
      padding: 7px 11px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
    }

    .saroar-avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
      background: #1e2433;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .saroar-avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .saroar-badge {
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #ffffff;
      background: linear-gradient(90deg, #2563eb, #0ea5e9);
      padding: 3px 9px;
      border-radius: 6px;
